name: Deploy Full App to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      APP_DIR: ${{ secrets.APP_DIR }}
      # Default application domain for deployment
      APP_DOMAIN: "fakechecker.kinexus.co.in"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug required env presence
        shell: bash
        run: |
          echo "Checking presence of required env vars (will not show values):"
          for v in DEPLOY_HOST DEPLOY_USER APP_DIR OPENAI_API_KEY; do
            val=$(eval echo "\$$v")
            if [ -n "$val" ]; then
              echo "$v=SET"
            else
              echo "$v=UNSET"
            fi
          done

      - name: Validate required secrets
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$APP_DIR"
          test -n "$OPENAI_API_KEY"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          else
            printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.env' \
            -e "ssh -p ${DEPLOY_PORT:-22}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${APP_DIR}/"

      - name: Configure app and restart service
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${APP_DIR}' && \
             APP_DIR='${APP_DIR}' APP_DOMAIN='${APP_DOMAIN}' OPENAI_API_KEY='${OPENAI_API_KEY}' \
             OPENAI_MODEL='${OPENAI_MODEL:-gpt-4o-mini}' SEARCH_PROVIDER='${SEARCH_PROVIDER:-serpapi}' \
             TAVILY_API_KEY='${TAVILY_API_KEY}' SERPAPI_API_KEY='${SERPAPI_API_KEY}' \
             bash deploy/remote-deploy.sh"