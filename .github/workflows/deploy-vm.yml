name: Deploy Full App to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      APP_DIR: ${{ secrets.APP_DIR }}
      # Default application domain for deployment
      APP_DOMAIN: "fakechecker.kinexus.co.in"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      SEARCH_PROVIDER: ${{ secrets.SEARCH_PROVIDER }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug required env presence
        shell: bash
        run: |
          echo "Checking presence of required env vars (will not show values):"
          for v in DEPLOY_HOST DEPLOY_USER APP_DIR OPENAI_API_KEY; do
            val=$(eval echo "\$$v")
            if [ -n "$val" ]; then
              echo "$v=SET"
            else
              echo "$v=UNSET"
            fi
          done

      - name: Validate required secrets
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$APP_DIR"
          test -n "$OPENAI_API_KEY"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          if [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            printf '%s' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          else
            printf '%s' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync project to server
        run: |
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude '__pycache__/' \
            --exclude '.env' \
            -e "ssh -p ${DEPLOY_PORT:-22}" \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:${APP_DIR}/"

      - name: Configure app and restart service
        run: |
          ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            APP_DIR="$APP_DIR" \
            APP_DOMAIN="$APP_DOMAIN" \
            OPENAI_API_KEY="$OPENAI_API_KEY" \
            OPENAI_MODEL="${OPENAI_MODEL:-gpt-4o-mini}" \
            SEARCH_PROVIDER="${SEARCH_PROVIDER:-serpapi}" \
            TAVILY_API_KEY="$TAVILY_API_KEY" \
            SERPAPI_API_KEY="$SERPAPI_API_KEY" \
            'bash -s' <<'EOF'
          set -euo pipefail

          cd "$APP_DIR"

          if ! command -v python3 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3 python3-venv python3-pip
          fi

          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi

          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

          cat > .env <<ENVFILE
OPENAI_API_KEY=$OPENAI_API_KEY
OPENAI_MODEL=$OPENAI_MODEL
SEARCH_PROVIDER=$SEARCH_PROVIDER
TAVILY_API_KEY=$TAVILY_API_KEY
SERPAPI_API_KEY=$SERPAPI_API_KEY
PORT=8000
ENVFILE

          sed \
            -e "s|__APP_DIR__|$APP_DIR|g" \
            -e "s|__APP_USER__|$USER|g" \
            deploy/fakechecker.service.template | sudo tee /etc/systemd/system/fakechecker.service >/dev/null

          sudo systemctl daemon-reload
          sudo systemctl enable fakechecker.service
          sudo systemctl restart fakechecker.service

          if [ -n "${APP_DOMAIN:-}" ]; then
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            sed \
              -e "s|__APP_DOMAIN__|$APP_DOMAIN|g" \
              -e "s|__APP_DIR__|$APP_DIR|g" \
              deploy/nginx.fakechecker.conf.template | sudo tee /etc/nginx/sites-available/fakechecker >/dev/null

            sudo ln -sf /etc/nginx/sites-available/fakechecker /etc/nginx/sites-enabled/fakechecker
            sudo nginx -t
            sudo systemctl reload nginx
          fi
          EOF